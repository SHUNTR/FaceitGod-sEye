<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 215" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="faceitOrangeGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="60%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#E03E00" />
    </linearGradient>

    <linearGradient id="topBevelFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8533" />
      <stop offset="100%" stop-color="#FF600A" />
    </linearGradient>

    <radialGradient id="pupilGlowFull" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF5E6" />
      <stop offset="30%" stop-color="#FFA84D" />
      <stop offset="70%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#992600" />
    </radialGradient>

    <filter id="eyeDropShadowFull" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;family=Rajdhani:wght@700&amp;display=swap');
      .txt-faceit-v {
        font-family: 'Orbitron', 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
        font-size: 16px;
        fill: #FF5500;
        letter-spacing: 2.5px;
      }
      .txt-godseye-v {
        font-family: 'Orbitron', 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800;
        font-size: 16px;
        fill: #FFFFFF;
        letter-spacing: 3px;
      }
    </style>
  </defs>

  <!-- Top Centered Icon -->
  <g transform="translate(25, 8) scale(1.5)">
    <!-- Main Solid Letter F Path -->
    <path 
      d="M20 14 H84 L72 28 H38 V44 H72 L60 58 H38 V70 L20 88 Z" 
      fill="url(#faceitOrangeGradFull)" 
      stroke="#CC3700"
      stroke-width="1.2"
      stroke-linejoin="miter"
    />

    <!-- Top Bar Facet Highlight -->
    <path d="M20 14 H84 L78 21 H28 L20 14 Z" fill="url(#topBevelFull)" opacity="0.8" />
    <path d="M38 44 H72 L66 51 H38 V44 Z" fill="url(#topBevelFull)" opacity="0.7" />

    <!-- Central Tactical "God's Eye" -->
    <g filter="url(#eyeDropShadowFull)">
      <path 
        d="M32 51 Q55 33 78 51 Q55 69 32 51 Z" 
        fill="#0E0E11" 
        stroke="#FF5500" 
        stroke-width="3" 
        stroke-linejoin="round"
      />
      <path 
        d="M36 51 Q55 38 74 51 Q55 64 36 51 Z" 
        fill="#1A1310" 
        stroke="#FF7729" 
        stroke-width="1.5"
      />
      <circle cx="55" cy="51" r="8.5" fill="url(#pupilGlowFull)" stroke="#FFB870" stroke-width="1" />
      <circle cx="55" cy="51" r="3.2" fill="#1C0500" />
      <circle cx="53" cy="49" r="1.3" fill="#FFFFFF" opacity="0.95" />

      <line x1="28" y1="51" x2="37" y2="51" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="73" y1="51" x2="82" y2="51" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="55" y1="31" x2="55" y2="39" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="55" y1="63" x2="55" y2="71" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Centered Text: FACEIT GOD'S EYE -->
  <g transform="translate(100, 192)" text-anchor="middle">
    <text y="0">
      <tspan class="txt-faceit-v">FACEIT </tspan>
      <tspan class="txt-godseye-v">GOD’S EYE</tspan>
    </text>
  </g>
</svg>
