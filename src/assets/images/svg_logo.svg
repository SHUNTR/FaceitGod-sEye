<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <g stroke="#ff8b52" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Внешние угловые скобки прицела -->
