<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="faceitOrangeGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="60%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#E03E00" />
    </linearGradient>

    <linearGradient id="topBevelH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8533" />
      <stop offset="100%" stop-color="#FF600A" />
    </linearGradient>

    <radialGradient id="pupilGlowH" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF5E6" />
      <stop offset="30%" stop-color="#FFA84D" />
      <stop offset="70%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#992600" />
    </radialGradient>

    <filter id="eyeDropShadowH" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;family=Rajdhani:wght@700&amp;display=swap');
      .title-faceit-h {
        font-family: 'Orbitron', 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
        font-size: 26px;
        fill: #FF5500;
        letter-spacing: 3px;
      }
      .title-godseye-h {
        font-family: 'Orbitron', 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800;
        font-size: 22px;
        fill: #FFFFFF;
        letter-spacing: 4.5px;
      }
    </style>
  </defs>

  <!-- Left Icon -->
  <g transform="translate(5, -5)">
    <path 
      d="M20 14 H84 L72 28 H38 V44 H72 L60 58 H38 V70 L20 88 Z" 
      fill="url(#faceitOrangeGradH)" 
      stroke="#CC3700"
      stroke-width="1.2"
      stroke-linejoin="miter"
    />
    <path d="M20 14 H84 L78 21 H28 L20 14 Z" fill="url(#topBevelH)" opacity="0.8" />
    <path d="M38 44 H72 L66 51 H38 V44 Z" fill="url(#topBevelH)" opacity="0.7" />

    <g filter="url(#eyeDropShadowH)">
      <path 
        d="M32 51 Q55 33 78 51 Q55 69 32 51 Z" 
        fill="#0E0E11" 
        stroke="#FF5500" 
        stroke-width="3" 
        stroke-linejoin="round"
      />
      <path 
        d="M36 51 Q55 38 74 51 Q55 64 36 51 Z" 
        fill="#1A1310" 
        stroke="#FF7729" 
        stroke-width="1.5"
      />
      <circle cx="55" cy="51" r="8.5" fill="url(#pupilGlowH)" stroke="#FFB870" stroke-width="1" />
      <circle cx="55" cy="51" r="3.2" fill="#1C0500" />
      <circle cx="53" cy="49" r="1.3" fill="#FFFFFF" opacity="0.95" />

      <line x1="28" y1="51" x2="37" y2="51" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="73" y1="51" x2="82" y2="51" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="55" y1="31" x2="55" y2="39" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="55" y1="63" x2="55" y2="71" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Right Typography -->
  <g transform="translate(108, 40)">
    <text class="title-faceit-h" x="0" y="0">FACEIT</text>
    <text class="title-godseye-h" x="0" y="27">GOD’S EYE</text>
  </g>
</svg>
